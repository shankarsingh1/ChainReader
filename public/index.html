<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wallet Analyzer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --color-bg: #f4f5f7;
      --color-surface: #ffffff;
      --color-elevated: #fafbfc;
      --color-border: #e2e5eb;
      --color-border-strong: #cdd2dc;
      --color-text: #1a2332;
      --color-text-secondary: #4a5568;
      --color-text-muted: #6b7280;
      --color-accent: #0d9488;
      --color-accent-hover: #0f766e;
      --color-accent-subtle: rgba(13, 148, 136, 0.1);
      --color-navy: #0f172a;
      --color-navy-soft: #1e293b;
      --color-error-bg: #fef2f2;
      --color-error-border: #fecaca;
      --color-error-text: #991b1b;
      --color-success-bg: #ecfdf5;
      --color-success-text: #065f46;
      --color-warn-bg: #fffbeb;
      --color-warn-text: #92400e;
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.06);
      --shadow-card: 0 4px 24px rgba(15, 23, 42, 0.08);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 14px;
      --font-sans: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-mono: ui-monospace, "Cascadia Code", "SF Mono", Menlo, Consolas, monospace;
      --space-xs: 0.375rem;
      --space-sm: 0.75rem;
      --space-md: 1rem;
      --space-lg: 1.5rem;
      --space-xl: 2rem;
      --space-2xl: 2.75rem;
      --transition: 0.18s ease;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font-sans);
      font-size: 16px;
      line-height: 1.6;
      color: var(--color-text);
      background: var(--color-bg);
      -webkit-font-smoothing: antialiased;
    }

    .page {
      max-width: 720px;
      margin: 0 auto;
      padding: var(--space-xl) var(--space-md) var(--space-2xl);
    }

    .page-header {
      margin-bottom: var(--space-2xl);
      padding-bottom: var(--space-lg);
      border-bottom: 1px solid var(--color-border);
    }

    .page-header__title {
      font-size: clamp(1.5rem, 4vw, 1.875rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--color-navy);
      line-height: 1.2;
    }

    .page-header__lede {
      margin-top: var(--space-sm);
      font-size: 0.9375rem;
      color: var(--color-text-secondary);
      max-width: 36em;
      line-height: 1.65;
    }

    .card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      padding: var(--space-lg);
      margin-bottom: var(--space-lg);
      transition: box-shadow var(--transition), border-color var(--transition);
    }

    .card:hover {
      box-shadow: var(--shadow-card);
      border-color: var(--color-border-strong);
    }

    .card--form:focus-within {
      box-shadow: var(--shadow-card);
      border-color: var(--color-border-strong);
    }

    .form-label {
      display: block;
      font-size: 0.8125rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--color-text-muted);
      margin-bottom: var(--space-sm);
    }

    .form-row {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-sm);
      align-items: stretch;
    }

    .input-address {
      flex: 1 1 200px;
      min-height: 48px;
      padding: 0 var(--space-md);
      font-family: var(--font-mono);
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--color-navy-soft);
      background: var(--color-elevated);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      outline: none;
      transition: border-color var(--transition), background var(--transition), box-shadow var(--transition);
    }

    .input-address::placeholder {
      color: var(--color-text-muted);
      font-weight: 400;
      font-family: var(--font-sans);
    }

    .input-address:hover {
      border-color: var(--color-border-strong);
    }

    .input-address:focus {
      background: var(--color-surface);
      border-color: var(--color-accent);
      box-shadow: 0 0 0 3px var(--color-accent-subtle);
    }

    .btn-primary {
      flex: 0 0 auto;
      min-height: 48px;
      padding: 0 var(--space-lg);
      font-family: inherit;
      font-size: 0.875rem;
      font-weight: 600;
      color: #fff;
      background: var(--color-accent);
      border: none;
      border-radius: var(--radius-md);
      cursor: pointer;
      white-space: nowrap;
      transition: background var(--transition), transform 0.12s ease, box-shadow var(--transition);
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--color-accent-hover);
      box-shadow: 0 2px 8px rgba(13, 148, 136, 0.35);
    }

    .btn-primary:focus-visible {
      outline: 2px solid var(--color-accent);
      outline-offset: 2px;
    }

    .btn-primary:active:not(:disabled) {
      transform: translateY(1px);
    }

    .btn-primary:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      box-shadow: none;
    }

    .output-region {
      margin-top: var(--space-md);
    }

    .result-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-card);
    }

    .result-card__header {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      padding: var(--space-md) var(--space-lg);
      background: var(--color-navy);
      color: #f8fafc;
    }

    .result-card__status {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--color-accent);
      flex-shrink: 0;
      box-shadow: 0 0 0 2px rgba(13, 148, 136, 0.35);
    }

    .result-card__title {
      font-size: 0.8125rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .result-card__body {
      padding: var(--space-lg);
    }

    .summary {
      font-size: 0.9375rem;
      font-weight: 500;
      line-height: 1.75;
      color: var(--color-text-secondary);
    }

    .tx-section {
      margin-top: var(--space-lg);
      padding-top: var(--space-lg);
      border-top: 1px solid var(--color-border);
    }

    .tx-section__label {
      font-size: 0.6875rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--color-text-muted);
      margin-bottom: var(--space-md);
    }

    .tx-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: var(--space-md);
      padding: var(--space-sm) 0;
      border-bottom: 1px solid var(--color-border);
      transition: background var(--transition);
    }

    .tx-row:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .tx-row:hover {
      background: linear-gradient(90deg, var(--color-accent-subtle) 0%, transparent 100%);
      margin: 0 calc(-1 * var(--space-sm));
      padding-left: var(--space-sm);
      padding-right: var(--space-sm);
      border-radius: var(--radius-sm);
    }

    .tx-destination {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--color-navy-soft);
    }

    .tx-time {
      font-size: 0.6875rem;
      color: var(--color-text-muted);
      margin-top: 2px;
    }

    .tx-meta {
      text-align: right;
      flex-shrink: 0;
    }

    .tx-value {
      font-size: 0.8125rem;
      font-weight: 700;
      color: var(--color-accent);
    }

    .badge {
      display: inline-block;
      margin-top: 4px;
      font-size: 0.625rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 3px 8px;
      border-radius: 999px;
    }

    .badge--ok {
      background: var(--color-success-bg);
      color: var(--color-success-text);
    }

    .badge--fail {
      background: var(--color-warn-bg);
      color: var(--color-warn-text);
    }

    .message-error {
      padding: var(--space-md) var(--space-lg);
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--color-error-text);
      background: var(--color-error-bg);
      border: 1px solid var(--color-error-border);
      border-radius: var(--radius-md);
    }

    .state-loading {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-sm);
      padding: var(--space-2xl) var(--space-lg);
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--color-text-muted);
      background: var(--color-surface);
      border: 1px dashed var(--color-border);
      border-radius: var(--radius-lg);
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid var(--color-border);
      border-top-color: var(--color-accent);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 520px) {
      .page {
        padding: var(--space-lg) var(--space-sm) var(--space-xl);
      }

      .form-row {
        flex-direction: column;
      }

      .btn-primary {
        width: 100%;
      }

      .tx-row {
        flex-direction: column;
        align-items: stretch;
      }

      .tx-meta {
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="page-header">
      <h1 class="page-header__title">Wallet Analyzer</h1>
      <p class="page-header__lede">Enter any Ethereum address to get an AI summary of its activity.</p>
    </header>

    <main>
      <section class="card card--form" aria-labelledby="address-label">
        <label class="form-label" id="address-label" for="addrInput">Ethereum wallet address</label>
        <div class="form-row">
          <input
            class="input-address"
            id="addrInput"
            type="text"
            autocomplete="off"
            spellcheck="false"
            placeholder="0xd8dA6BF26964aF9D7eEd9e03E53415D37aA96045"
            aria-describedby="address-hint"
          />
          <button class="btn-primary" id="analyzeBtn" type="button" onclick="analyze()">Analyze</button>
        </div>
        <p id="address-hint" class="visually-hidden">Press Enter or use the Analyze button to submit.</p>
      </section>

      <section class="output-region" id="output" aria-live="polite"></section>
    </main>
  </div>

  <script>
    async function analyze() {
      const addr = document.getElementById('addrInput').value.trim() || '0xd8dA6BF26964aF9D7eEd9e03E53415D37aA96045';
      const out = document.getElementById('output');
      const btn = document.getElementById('analyzeBtn');
      btn.disabled = true;
      out.innerHTML = `<div class="state-loading"><span class="spinner" aria-hidden="true"></span>Fetching transactions…</div>`;

      try {
        const response = await fetch(`/analyze?address=${encodeURIComponent(addr)}`);
        const data = await response.json();
        if (data.error) throw new Error(data.error);
        const { summary, txs } = data;

        out.innerHTML = `
        <article class="result-card">
          <div class="result-card__header">
            <span class="result-card__status" aria-hidden="true"></span>
            <span class="result-card__title">Analysis complete — ${addr.slice(0, 6)}…${addr.slice(-4)}</span>
          </div>
          <div class="result-card__body">
            <p class="summary">${summary}</p>
            <div class="tx-section">
              <div class="tx-section__label">Last 10 transactions</div>
              ${txs.map(tx => `
                <div class="tx-row">
                  <div>
                    <div class="tx-destination">→ ${tx.to ? tx.to.slice(0, 10) + '…' : 'Contract'}</div>
                    <div class="tx-time">${tx.time}</div>
                  </div>
                  <div class="tx-meta">
                    <div class="tx-value">${tx.value}</div>
                    <span class="badge ${tx.status === 'Success' ? 'badge--ok' : 'badge--fail'}">${tx.status}</span>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        </article>`;
      } catch (e) {
        out.innerHTML = `<div class="message-error" role="alert">${e.message}</div>`;
      }
      btn.disabled = false;
    }

    document.getElementById('addrInput').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') analyze();
    });
  </script>
</body>
</html>
